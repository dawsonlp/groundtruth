uri: req://logical/define-entity-schema
title: Define Logical Entity Schema
intent: Defines a DAMA-compliant logical entity with typed attributes, nullability constraints, primary key indicators, and conceptual mappings.
component: logical
contract:
  preconditions:
    - description: Entity must link to an existing conceptual term URI
      expression: catalog.has_node(entity.conceptual_term_ref) == True
    - description: Entity must declare at least one primary key attribute
      expression: any(attr.is_primary_key for attr in entity.attributes)
  postconditions:
    - description: Logical entity is registered under data://logical/<domain>/<EntityName>
      expression: catalog.has_logical_entity(entity.uri) == True
failure_modes:
  - error_name: MissingPrimaryKeyError
    trigger_condition: Entity schema defined without a primary key
    recovery_action: Declare primary key attribute or surrogate ID
    domain_error_code: LOGICAL_001
  - error_name: UnmappedConceptualTermError
    trigger_condition: Conceptual term reference does not exist in conceptual catalog
    recovery_action: Register conceptual term before defining logical entity
    domain_error_code: LOGICAL_002
governed_by:
  - decision://groundtruth/adr-0001-mof-and-dama-meta-model-conformance
lifecycle: ACTIVE
tags:
  - logical
  - schemas
