uri: req://governance/enforce-privacy-tagging
title: Enforce Data Privacy Classification
intent: Inspects and enforces privacy classification metadata (PII, Financial, Internal, Public) on all logical entity attributes.
component: governance
contract:
  preconditions:
    - description: Logical entity must declare classification on all sensitive attributes
      expression: all(has_classification(a) for a in entity.attributes if a.is_sensitive)
  postconditions:
    - description: Generates compliance audit certificate and masking rules
      expression: certificate.is_valid == True
failure_modes:
  - error_name: UnclassifiedSensitiveDataError
    trigger_condition: Sensitive attribute lacks classification tag
    recovery_action: Prompt data steward for PII/GDPR classification level
    domain_error_code: GOVERNANCE_001
governed_by:
  - decision://groundtruth/adr-0001-mof-and-dama-meta-model-conformance
constraints:
  - constraint://groundtruth/mandatory-pii-classification
policies:
  - policy://compliance/gdpr-article-30
lifecycle: ACTIVE
tags:
  - privacy
  - pii
  - gdpr
