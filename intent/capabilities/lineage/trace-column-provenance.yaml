uri: req://lineage/trace-column-provenance
title: Trace Column-Level Data Provenance
intent: Traverses upstream sources and downstream transform targets for a specified logical attribute across the enterprise graph.
component: lineage
contract:
  preconditions:
    - description: Target attribute URI must exist in logical data catalog
      expression: catalog.has_attribute(target_attribute_uri) == True
  postconditions:
    - description: Returns directed acyclic graph of upstream sources and downstream projections
      expression: isinstance(lineage_graph, DirectedGraph)
failure_modes:
  - error_name: UnknownAttributeError
    trigger_condition: Attribute URI not found
    recovery_action: Verify logical entity path and attribute name
    domain_error_code: LINEAGE_001
governed_by:
  - decision://groundtruth/adr-0001-mof-and-dama-meta-model-conformance
lifecycle: ACTIVE
tags:
  - lineage
  - provenance

