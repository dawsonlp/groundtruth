uri: req://conceptual/define-property-concept
title: Define Reusable Property Concept
intent: Defines a reusable conceptual property concept (e.g. Designation, Definition, OccurrenceTime, LifecycleState, Classification) applied across object classes to form DataElementConcepts.
component: conceptual
contract:
  preconditions:
    - description: Concept name must be a recognized conceptual property category
      expression: concept.name in ['Designation', 'Definition', 'Purpose', 'Scope', 'Classification', 'Canonical Reference', 'Version Designation', 'Authority', 'Lifecycle State', 'Evidence Fingerprint', 'Occurrence Time', 'Rationale', 'Native Language', 'Expression Text', 'Lexical Representation', 'Product Designation', 'Inventory Exception']
    - description: Conceptual domain must be declared
      expression: len(concept.domain.strip()) > 0
  postconditions:
    - description: Property concept is registered under data://conceptual/properties/<slug>
      expression: catalog.has_property_concept(concept.slug) == True
failure_modes:
  - error_name: InvalidPropertyConceptError
    trigger_condition: Property concept category is not recognized in governing definition
    recovery_action: Select an approved property concept category or propose an extension to DML-CON
    domain_error_code: CONCEPTUAL_002
governed_by:
  - decision://groundtruth/adr-0001-require-mof-conformance-for-the-governing-model-definition
  - decision://groundtruth/adr-0002-dama-aligned-4-tier-data-modeling-architecture
constraints:
  - constraint://groundtruth/mandatory-business-definition
lifecycle: ACTIVE
tags:
  - glossary
  - property-concepts
  - dama

