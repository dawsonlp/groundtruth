uri: constraint://groundtruth/mof-meta-level-separation
title: MOF Meta-Level Separation
rule_type: ARCHITECTURAL_BOUNDARY
description: Model definitions at level M2 (metamodels) must not contain operational subject instance data (M0) or customer-specific rows.
target_scope: data://conceptual/*, data://logical/*
executable_expression: "model.meta_level != 'M0'"
remediation_hint: Separate operational runtime instance data (M0) from domain model definitions (M1) and metamodel rules (M2).
governing_adr: decision://groundtruth/adr-0001-require-mof-conformance-for-the-governing-model-definition
status: ACTIVE
