uri: constraint://groundtruth/mandatory-business-definition
title: Mandatory Plain-Language Business Definition
rule_type: DATA_INTEGRITY
description: Every conceptual business term must provide a clear, non-empty plain-language definition.
target_scope: data://conceptual/*
executable_expression: "len(term.definition.strip()) > 0"
remediation_hint: Add a descriptive business definition explaining the real-world business meaning of this term.
governing_adr: decision://groundtruth/adr-0001-mof-and-dama-meta-model-conformance
status: ACTIVE
