domain: northstar
name: Contract
conceptual_term_ref: data://conceptual/capability
description: Formal operational preconditions and postconditions for a capability version.
attributes:
  - name: contract_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Unique operational contract identifier.
  - name: capability_id
    data_type:
      primitive: UUID
    is_nullable: false
    description: Target capability foreign key.
  - name: version_tag
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    default_value: "'@v1'"
    description: Pinned version qualifier for this contract specification.
  - name: precondition_spec
    data_type:
      primitive: STRING
    is_nullable: true
    description: Preconditions required before execution.
  - name: postcondition_spec
    data_type:
      primitive: STRING
    is_nullable: true
    description: Guaranteed postconditions after successful execution.
relations:
  - name: contract_capability_fk
    target_entity_uri: data://logical/northstar/Capability
    source_attribute: capability_id
    target_attribute: capability_id
    relationship_type: ONE_TO_ONE
    is_required: true
lifecycle: ACTIVE
