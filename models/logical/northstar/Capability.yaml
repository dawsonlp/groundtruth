domain: northstar
name: Capability
conceptual_term_ref: data://conceptual/capability
description: Atomic operational contract and functional intent specification with Option B coordinate scoping.
attributes:
  - name: capability_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Unique capability surrogate identifier.
  - name: uri
    data_type:
      primitive: STRING
      max_length: 255
    is_nullable: false
    description: Canonical Option B requirement URI (req://[tenant:][solution]/[action][@version]).
  - name: component_id
    data_type:
      primitive: UUID
    is_nullable: false
    description: Owning architectural component foreign key.
  - name: tenant_slug
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    default_value: "'tripartite'"
    description: Owning tenant identifier.
  - name: solution_slug
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    default_value: "'northstar'"
    description: Solution package slug.
  - name: version_tag
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    default_value: "'@v1'"
    description: Contract evolution milestone qualifier.
  - name: title
    data_type:
      primitive: STRING
      max_length: 200
    is_nullable: false
    description: Descriptive capability title.
  - name: intent
    data_type:
      primitive: STRING
    is_nullable: false
    description: Formal business intent statement.
  - name: lifecycle
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    default_value: "'ACTIVE'"
    description: Lifecycle state (DRAFT, PROPOSED, ACTIVE, DEPRECATED, RETIRED).
relations:
  - name: capability_component_fk
    target_entity_uri: data://logical/northstar/Component
    source_attribute: component_id
    target_attribute: component_id
    relationship_type: MANY_TO_ONE
    is_required: true
lifecycle: ACTIVE
