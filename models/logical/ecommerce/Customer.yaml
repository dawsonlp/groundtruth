domain: ecommerce
name: Customer
conceptual_term_ref: data://conceptual/customer
description: Registered retail customer profile and billing details.
attributes:
  - name: customer_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Unique customer identifier.
  - name: email
    data_type:
      primitive: STRING
      max_length: 255
    is_nullable: false
    is_unique: true
    is_sensitive: true
    tags: ["PII", "CONFIDENTIAL"]
    description: Primary contact email address.
  - name: full_name
    data_type:
      primitive: STRING
      max_length: 255
    is_nullable: false
    is_sensitive: true
    tags: ["PII"]
    description: Customer full legal name.
  - name: status
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    default_value: "'ACTIVE'"
    description: Account status (ACTIVE, SUSPENDED, DEACTIVATED).
  - name: created_at
    data_type:
      primitive: TIMESTAMP
    is_nullable: false
    description: Account creation timestamp.
relations: []
lifecycle: ACTIVE

