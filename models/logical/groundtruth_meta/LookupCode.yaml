domain: groundtruth_meta
name: LookupCode
conceptual_term_ref: data://conceptual/reference-code
description: Reference code table cataloging defined vocabularies, enumerated status domains, and lifecycle categories.
attributes:
  - name: code_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Primary identifier for lookup code entry.
  - name: code_set
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    description: Controlled vocabulary category (e.g. LIFECYCLE_STATUS, RELATIONSHIP_TYPE, PRIMITIVE_TYPE).
  - name: code_value
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    description: Canonical machine-readable enum value (e.g. ACTIVE, DEPRECATED, ONE_TO_MANY).
  - name: display_label
    data_type:
      primitive: STRING
      max_length: 100
    is_nullable: false
    description: Human-readable display label.
  - name: description
    data_type:
      primitive: STRING
    is_nullable: true
    description: Detailed definition of what this code represents.
  - name: is_active
    data_type:
      primitive: BOOLEAN
    is_nullable: false
    default_value: "TRUE"
    description: Whether code is currently active and selectable.
relations: []
lifecycle: ACTIVE

