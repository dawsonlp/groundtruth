domain: groundtruth_meta
name: Solution
conceptual_term_ref: data://conceptual/solution-model
description: Bounded solution context encapsulating conceptual ontologies, logical entities, and physical projections.
attributes:
  - name: solution_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Primary identifier for solution domain package.
  - name: tenant_id
    data_type:
      primitive: UUID
    is_nullable: false
    description: Parent tenant organization foreign key.
  - name: slug
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    is_unique: true
    description: Unique solution slug (e.g. ecommerce, codemesh, groundtruth_meta).
  - name: display_name
    data_type:
      primitive: STRING
      max_length: 100
    is_nullable: false
    description: Human-readable display title with icon.
  - name: description
    data_type:
      primitive: STRING
    is_nullable: true
    description: Detailed description of solution purpose.
  - name: version
    data_type:
      primitive: STRING
      max_length: 20
    is_nullable: false
    default_value: "'1.0.0'"
    description: Semantic version string.
  - name: created_at
    data_type:
      primitive: TIMESTAMP
    is_nullable: false
    description: Timestamp of solution registration.
relations:
  - name: solution_tenant_fk
    target_entity_uri: data://logical/groundtruth_meta/Tenant
    source_attribute: tenant_id
    target_attribute: tenant_id
    relationship_type: MANY_TO_ONE
    is_required: true
lifecycle: ACTIVE

