domain: groundtruth_meta
name: LogicalRelationship
conceptual_term_ref: data://conceptual/junction-entity
description: Relational association or junction entity defining explicit foreign key connections between logical entities.
attributes:
  - name: relationship_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Primary identifier for relationship definition.
  - name: source_entity_id
    data_type:
      primitive: UUID
    is_nullable: false
    description: Source entity foreign key.
  - name: name
    data_type:
      primitive: STRING
      max_length: 100
    is_nullable: false
    description: Unique relationship identifier name.
  - name: target_entity_uri
    data_type:
      primitive: STRING
      max_length: 255
    is_nullable: false
    description: Target entity URI (data://logical/...).
  - name: source_attribute
    data_type:
      primitive: STRING
      max_length: 100
    is_nullable: false
    description: Local foreign key attribute name.
  - name: target_attribute
    data_type:
      primitive: STRING
      max_length: 100
    is_nullable: false
    description: Target primary key attribute name.
  - name: relationship_type
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    description: Relationship cardinality (MANY_TO_ONE, ONE_TO_MANY, ONE_TO_ONE, MANY_TO_MANY).
  - name: is_required
    data_type:
      primitive: BOOLEAN
    is_nullable: false
    default_value: "TRUE"
    description: Whether foreign key reference is mandatory.
relations:
  - name: rel_source_entity_fk
    target_entity_uri: data://logical/groundtruth_meta/Entity
    source_attribute: source_entity_id
    target_attribute: entity_id
    relationship_type: MANY_TO_ONE
    is_required: true
lifecycle: ACTIVE
