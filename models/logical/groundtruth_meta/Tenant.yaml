domain: groundtruth_meta
name: Tenant
conceptual_term_ref: data://conceptual/tenant
description: Top-level organizational isolation boundary containing multiple solutions and data catalogs.
attributes:
  - name: tenant_id
    data_type:
      primitive: UUID
    is_primary_key: true
    is_nullable: false
    description: Primary unique identifier for tenant organization.
  - name: slug
    data_type:
      primitive: STRING
      max_length: 50
    is_nullable: false
    is_unique: true
    description: URL-safe slug identifier (e.g. tripartite).
  - name: name
    data_type:
      primitive: STRING
      max_length: 100
    is_nullable: false
    description: Human-readable organization name.
  - name: is_active
    data_type:
      primitive: BOOLEAN
    is_nullable: false
    default_value: "TRUE"
    description: Whether tenant account is active.
  - name: created_at
    data_type:
      primitive: TIMESTAMP
    is_nullable: false
    description: Tenant creation timestamp.
relations: []
lifecycle: ACTIVE

